name: WDL CI

on:
  push

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  DEBIAN_FRONTEND: noninteractive
  AWS_REGION: us-west-2
  # CZID-40 (CICD-6): drive the CI identity from repo/org Actions variables so it is rotatable and
  # not tied to a hardcoded account. Falls back to the current values if the vars are unset, so this
  # is safe to merge before the Actions variables are configured.
  CI_ACCOUNT_ID: ${{ vars.CI_ACCOUNT_ID || '941377154785' }}
  GHA_ROLE: ${{ vars.GHA_ROLE || 'gha-seqtoid' }}

# Cancels superseded in-progress runs; replaced the custom 'cancel-previous' job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # CZID-445 (C9): static WDL validation gate. Runs `make lint`, which is
  #   - pre-commit (miniwdl check) over every workflows/**/*.wdl
  #   - flake8 over the Python helpers/tasks
  # In-progress cancellation is handled by the top-level `concurrency:` block
  # above (which replaced the old andymckay/cancel-action + cancel-previous job),
  # so no explicit cancel step is needed here.
  linters:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{runner.os}}-cache
      - name: dependencies
        run: |
          source /etc/profile
          sudo apt-get -qq update
          sudo apt-get -qq install --yes jq moreutils make virtualenv zip unzip httpie git shellcheck
          virtualenv --python=python3.10 .venv
          source .venv/bin/activate
          pip install -r requirements-dev.txt
      - name: linters
        run: |
          source .venv/bin/activate
          make lint

  list-workflow-dirs:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{steps.list_dirs.outputs.matrix}}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: list_dirs
        run: echo "matrix=$(./scripts/diff-workflows.sh |jq -cnR '[inputs|select(length>0)]')" >> $GITHUB_OUTPUT
      - id: echo_output
        run: echo "$GITHUB_OUTPUT"

  wdl-ci:
    runs-on: ubuntu-22.04
    needs: list-workflow-dirs
    # Fork guard (#581): this job assumes an AWS IAM role via OIDC (configure aws credentials
    # below) and pushes to ECR, which only the canonical repo's AWS account trusts. This
    # workflow is push-triggered, so on a contributor's fork the push runs here and the role
    # assume fails, blocking otherwise-good work. github.event.repository.fork is true only on
    # forks, so skip there. NOTE: this is a SKIP, not a silent pass -- the WDL CI build/tests
    # (short/long-read-mngs, etc.) do not run on forks; they run in full on the canonical repo.
    # Making forks able to assume the role is a separate, AWS-gated change (#581 part 2).
    if: ${{ github.event.repository.fork == false && needs['list-workflow-dirs'].outputs.matrix != '[]' && needs['list-workflow-dirs'].outputs.matrix != '' }}
    strategy:
      matrix:
        workflow_dir: ${{fromJson(needs['list-workflow-dirs'].outputs.matrix)}}
    permissions: # these permissions must be set for AWS auth to work
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: configure aws credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.CI_ACCOUNT_ID }}:role/${{ env.GHA_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        uses: docker/login-action@v4
        with:
            registry: ${{ env.CI_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.workflow_dir }}
      - name: docker build + push to ECR
        run: |
          TAG=$(git describe --long --tags --always --dirty)
          IMAGE_URI="${{ env.CI_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.workflow_dir }}"

          CACHE_FROM=""; docker pull "$IMAGE_URI" && CACHE_FROM="--cache-from $IMAGE_URI"
          ./scripts/docker-build.sh "workflows/${{ matrix.workflow_dir }}" --tag "${IMAGE_URI}:${TAG}" $CACHE_FROM \
            || ./scripts/docker-build.sh "workflows/${{ matrix.workflow_dir }}" --tag "${IMAGE_URI}:${TAG}"
          docker push "${IMAGE_URI}:${TAG}"
          if [[ ${GITHUB_REF##*/} == "main" ]]; then
            docker tag "${IMAGE_URI}:${TAG}" "${IMAGE_URI}:latest"
            docker push "${IMAGE_URI}:latest"
          fi

          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
      - name: run tests
        run: |
          # explicitly block EC2 IMDS endpoint to work around awscli issue:
          # https://github.com/aws/aws-cli/issues/5234#issuecomment-635459464
          # https://github.com/aws/aws-cli/issues/5262
          sudo ip route add blackhole 169.254.169.254

          # configure miniwdl to auto-delete task working directories, to reduce chance of worker
          # running out of space
          export MINIWDL__FILE_IO__OUTPUT_HARDLINKS=true
          export MINIWDL__FILE_IO__DELETE_WORK=success
          export MINIWDL__DOWNLOAD_CACHE__GET=true
          export MINIWDL__DOWNLOAD_CACHE__PUT=true
          export MINIWDL__DOWNLOAD_CACHE__DIR="$(mktemp -d --tmpdir miniwdl_download_cache_XXXXXX)"

          source /etc/profile
          sudo apt-get -qq update
          sudo apt-get -qq install --yes jq moreutils make virtualenv zip unzip httpie git shellcheck
          virtualenv --python=python3.10 .venv
          source .venv/bin/activate
          pip install -r requirements-dev.txt

          export DOCKER_IMAGE_ID="${IMAGE_URI}:${TAG}"

          make test-${{ matrix.workflow_dir }}
